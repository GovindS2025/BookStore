# 🐳 Docker-specific configuration
# This file is used when running in Docker containers

# 🔌 Spring DataSource Configuration for Docker
spring:
  datasource:
    url: jdbc:postgresql://postgres-db:5432/BookStore
    username: postgres
    password: ${DB_PASSWORD:Wrong123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  redis:
    host: redis_cache
    port: 6379
  kafka:
    bootstrap-servers: kafka:29092
    consumer:
      group-id: bookstore-app
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
        session.timeout.ms: 30000
        heartbeat.interval.ms: 10000
        max.poll.interval.ms: 300000
        request.timeout.ms: 40000
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        request.timeout.ms: 40000
        delivery.timeout.ms: 120000
    listener:
      ack-mode: batch
      missing-topics-fatal: false
      auto-startup: true
      startup-timeout: 60000
    enabled: true

# 🌐 CORS Configuration for Docker
cors:
  allowed-origins: ["http://localhost:3000", "http://127.0.0.1:3000", "http://localhost:8080", "http://127.0.0.1:8080", "*"]
  allowed-methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS", "HEAD"]
  allowed-headers: ["*"]
  allow-credentials: true

# 🔐 JWT Configuration
jwt:
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXN1cGVyLXNlY3JldC1rZXktdGhhdC1pcy1tb3JlLXRoYW4tMzItYnl0ZXMhISE=}
  expiration: 86400000

# 💳 Stripe Configuration
stripe:
  secret:
    key: ${STRIPE_SECRET_KEY:your-stripe-secret-key}
    # Stripe secret key (ensure this is a test key for development)
  publishable:
    key: ${STRIPE_PUBLISHABLE_KEY:your-stripe-publishable-key}
    # Stripe publishable key (this is the key you can use on the frontend)

# 🔑 Google OAuth Configuration
google:
  oauth2:
    client:
      id: ${GOOGLE_CLIENT_ID:your-google-client-id}
      secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}

# ☁️ AWS S3 Configuration
cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID:your-aws-access-key} # AWS access key
      secret-key: ${AWS_SECRET_ACCESS_KEY:your-aws-secret-key} # AWS secret key (🔐 Sensitive: consider environment variables for production)
    region:
      static: ${AWS_REGION:eu-north-1} # AWS region
    s3:
      bucket-name: ${AWS_S3_BUCKET:bookstoreimagesbkt} # S3 bucket name

# 📧 Mail Configuration
spring:
  mail:
    host: ${MAIL_HOST:live.smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:api}
    password: ${MAIL_PASSWORD:your-mail-password}
    from: ${MAIL_FROM:hello@demomailtrap.co}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
          ssl:
            trust: live.smtp.mailtrap.io

# 📊 Logging Configuration
logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    com.org.bookstore_backend: DEBUG

# 🖼️ Local Images Configuration
app:
  local-images:
    directory: /app/images # Local directory in Docker container
    url-prefix: /api/images/local/ # URL prefix for serving local images
    enabled: true # Enable local image serving

# 🚨 Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
